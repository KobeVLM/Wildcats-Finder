spring.application.name=wildcats-finder

# Setup JDBC connection
spring.datasource.url=jdbc:mysql://localhost:3306/wildcatsdb

# Setup db login credentials
spring.datasource.username=root
spring.datasource.password=13456

# Auto create tables based on entities (update instead of create-drop)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# For stack trace error not to appear 
server.error.include-stacktrace=never

# server.port = 8080

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File storage location
file.upload-dir=./uploads
