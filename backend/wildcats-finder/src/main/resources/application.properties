spring.application.name=wildcats-finder

# Setup JDBC connection
spring.datasource.url=jdbc:mysql://localhost:3306/wildcatsdb

# Setup db login credentials
spring.datasource.username=root
spring.datasource.password=

# Auto create tables based on entities (update instead of create-drop)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# use 'update' for preserving data between restarts
# use 'create-drop' for fresh schema on each start 
spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# For stack trace error not to appear 
server.error.include-stacktrace=never

# server.port = 8080
