spring.application.name=wildcats-finder

# Setup JDBC connection - Using H2 embedded database
spring.datasource.url=jdbc:h2:mem:wildcatsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver

# Setup db login credentials
spring.datasource.username=root
spring.datasource.password=

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true

# Auto create tables based on entities (update instead of create-drop)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# use 'update' for preserving data between restarts
# use 'create-drop' for fresh schema on each start 
spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.H2Dialect

# For stack trace error not to appear 
server.error.include-stacktrace=never

# server.port = 8080
