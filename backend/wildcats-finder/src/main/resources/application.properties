spring.application.name=wildcats-finder

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/wildcatsdb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console (optional)
# spring.h2.console.enabled=false

# Other settings
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# JWT Configuration
jwt.secret=wildcatsfinder-super-secret-key-that-is-at-least-256-bits-long-for-security
jwt.expiration=86400000
jwt.refresh-expiration=604800000